<g transform="translate(927.5,40.0)">
<rect x="-240.0" y="0" width="480.0" height="202.0" rx="5" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.2" stroke-dasharray="7,5" />
<rect x="162.0" y="16.0" width="62" height="26" rx="4" fill="none" stroke="#4FC3E8" stroke-width="1.6" />
<text class="card-badge-text" x="193.0" y="34.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
<text class="card-name" x="-216.0" y="40" font-size="30">QSystemABC</text>
<text class="card-remark" x="-216.0" y="74.0">the contract:</text>
<text class="card-remark" x="-216.0" y="108.0">must provide</text>
<text class="card-remark" x="-216.0" y="142.0">.Hamiltonian()</text>
</g>
<g transform="translate(533.0,349.0)">
<rect x="-240.0" y="0" width="480.0" height="168.0" rx="5" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.2" stroke-dasharray="7,5" />
<rect x="162.0" y="16.0" width="62" height="26" rx="4" fill="none" stroke="#4FC3E8" stroke-width="1.6" />
<text class="card-badge-text" x="193.0" y="34.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
<text class="card-name" x="-216.0" y="40" font-size="30">SimpleSystemABC</text>
<text class="card-remark" x="-216.0" y="74.0">one mode, dim N —</text>
<text class="card-remark" x="-216.0" y="108.0">the composable unit</text>
</g>
<g transform="translate(1322.0,332.0)">
<rect x="-240.0" y="0" width="480.0" height="202.0" rx="5" fill="#101C2C" stroke="#7C93A6" stroke-width="1.8" />
<text class="card-name" x="-216.0" y="40" font-size="30">CombinedSystem</text>
<text class="card-remark" x="-216.0" y="74.0">⊗-composes several</text>
<text class="card-remark" x="-216.0" y="108.0">subsystems into</text>
<text class="card-remark" x="-216.0" y="142.0">one space</text>
</g>
<g transform="translate(270.0,641.0)">
<rect x="-240.0" y="0" width="480.0" height="206.0" rx="5" fill="#101C2C" stroke="#7C93A6" stroke-width="1.8" />
<text class="card-name" x="-216.0" y="40" font-size="30">ResonatorMode</text>
<text class="card-formula" x="-216.0" y="74.0"><tspan>H = ω &#183; </tspan><tspan>n</tspan></text>
<polyline points="-71.3,55.0 -62.9,44.6 -54.6,55.0" fill="none" stroke="#7C93A6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
<text class="card-remark" x="-216.0" y="108.0">a single harmonic mode</text>
<circle cx="-223.0" cy="150.0" r="5.5" fill="#E0A458" />
<text class="port-label" x="-203.0" y="156.0">port  ω</text>
</g>
<g transform="translate(796.0,624.0)">
<rect x="-240.0" y="0" width="480.0" height="240.0" rx="5" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.2" stroke-dasharray="7,5" />
<rect x="162.0" y="16.0" width="62" height="26" rx="4" fill="none" stroke="#4FC3E8" stroke-width="1.6" />
<text class="card-badge-text" x="193.0" y="34.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
<text class="card-name" x="-216.0" y="40" font-size="30">TransmonABC</text>
<text class="card-remark" x="-216.0" y="74.0">circuit energies:</text>
<text class="card-remark" x="-216.0" y="108.0">Ec (charging),</text>
<text class="card-remark" x="-216.0" y="142.0">Ej (Josephson)</text>
<circle cx="-223.0" cy="184.0" r="5.5" fill="#E0A458" />
<text class="port-label" x="-203.0" y="190.0">port  Ej</text>
</g>
<g transform="translate(796.0,954.0)">
<rect x="-240.0" y="0" width="480.0" height="236.0" rx="5" fill="#101C2C" stroke="#7C93A6" stroke-width="1.8" />
<text class="card-name" x="-216.0" y="40" font-size="30">TransmonKerr</text>
<text class="card-remark" x="-216.0" y="74.0">weakly-anharmonic</text>
<text class="card-remark" x="-216.0" y="108.0">transmon:</text>
<text class="card-remark" x="-216.0" y="142.0">linear + Kerr,</text>
<text class="card-remark" x="-216.0" y="176.0">from (Ec, ω_qub)</text>
</g>
<g transform="translate(927.5,1470.0)">
<rect x="-310.0" y="0" width="620.0" height="168.0" rx="5" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.2" stroke-dasharray="7,5" />
<rect x="232.0" y="16.0" width="62" height="26" rx="4" fill="none" stroke="#4FC3E8" stroke-width="1.6" />
<text class="card-badge-text" x="263.0" y="34.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
<text class="card-name" x="-286.0" y="40" font-size="30">RespResmTmnABC</text>
<text class="card-remark" x="-286.0" y="74.0">resonator split into ± modes</text>
<text class="card-remark" x="-286.0" y="108.0">plus a transmon subsystem</text>
</g>
<g transform="translate(927.5,1728.0)">
<rect x="-310.0" y="0" width="620.0" height="168.0" rx="5" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.2" stroke-dasharray="7,5" />
<rect x="232.0" y="16.0" width="62" height="26" rx="4" fill="none" stroke="#4FC3E8" stroke-width="1.6" />
<text class="card-badge-text" x="263.0" y="34.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
<text class="card-name" x="-286.0" y="40" font-size="30">RespResmTmnKerrABC</text>
<text class="card-remark" x="-286.0" y="74.0">fixes the transmon to</text>
<text class="card-remark" x="-286.0" y="108.0">TransmonKerr(N, Ec, ω_qub)</text>
</g>
<g transform="translate(927.5,1986.0)">
<rect x="-310.0" y="0" width="620.0" height="206.0" rx="5" fill="#101C2C" stroke="#7C93A6" stroke-width="1.8" />
<text class="card-name" x="-286.0" y="40" font-size="30">RespResmTmnKerrDirect</text>
<text class="card-remark" x="-286.0" y="74.0">+ direct g-coupling,</text>
<text class="card-remark" x="-286.0" y="108.0">Purcell-filter relaxation</text>
<circle cx="-293.0" cy="150.0" r="5.5" fill="#E0A458" />
<text class="port-label" x="-273.0" y="156.0">port  g</text>
</g>
<g transform="translate(927.5,2282.0)">
<rect x="-310.0" y="0" width="620.0" height="230.0" rx="5" fill="#101C2C" stroke="#7C93A6" stroke-width="1.8" />
<text class="card-name" x="-286.0" y="40" font-size="30">RespResmTmnKerrDirectDriven</text>
<text class="card-remark" x="-286.0" y="74.0">+ external drives, moved</text>
<text class="card-remark" x="-286.0" y="108.0">into the ω_drive rotating frame</text>
<circle cx="-293.0" cy="150.0" r="5.5" fill="#E0A458" />
<text class="port-label" x="-273.0" y="156.0">ports  drive_res, drive_tmn,</text>
<text class="port-label" x="-273.0" y="180.0">ω_drive</text>
</g>
</svg>
