<path d="M 1262.0,534.0 C 1132.0,589.0 723.0,589.0 593.0,534.0" fill="none" stroke="#E0A458" stroke-width="2.3" stroke-dasharray="1,7" stroke-linecap="round" />
<text class="arc-label" x="927.5" y="592.0" text-anchor="middle" stroke="#101C2C" stroke-width="6" paint-order="stroke">subsystems: 0..*</text>
<rect x="1253.5" y="525.5" width="17.0" height="17.0" fill="#E0A458" transform="rotate(45 1262.0 534.0)" />
