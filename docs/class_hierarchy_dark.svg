<text class="card-formula" x="-360.0" y="-30.0"><tspan>H = ω &#183; </tspan><tspan>n</tspan></text>
<polyline points="-173.0,-54.5 -162.3,-68.0 -151.5,-54.5" fill="none" stroke="#7C93A6" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" />
