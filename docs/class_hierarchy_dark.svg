<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3255" height="4737" viewBox="-15 0 3255 4737" role="img" aria-label="Class hierarchy of dq_systems. Top: the general framework - QSystemABC branches into SimpleSystemABC (ResonatorMode, TransmonABC, TransmonKerr) and CombinedSystem. Bottom, in its own separated zone: the concrete resp_resm_tmn circuit chain from RespResmTmnABC to RespResmTmnKerrDirectDriven, which inherits from CombinedSystem and composes a TransmonABC, both up in the framework zone. Only ResonatorMode, TransmonABC, RespResmTmnKerrDirect, and RespResmTmnKerrDirectDriven carry a Param port of their own.">
<defs>
  <style>
