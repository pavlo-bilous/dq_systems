<text class="card-name" x="-360.0" y="-67.5" font-size="42.5">TransmonKerr</text>
<text class="card-remark" x="-360.0" y="7.5">weakly-anharmonic transmon:</text>
<text class="card-remark" x="-360.0" y="65.0">linear + Kerr, from (Ec, ω_qub)</text>
</g>
<g transform="translate(1893.75,2645.0)">
<rect x="-425.0" y="-152.5" width="850.0" height="305.0" rx="10.0" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.7" stroke-dasharray="17.5,12.5" />
