<path d="M 741.5,1470.0 C 701.5,1310.0 1194.0,974.0 1044.0,754.0" fill="none" stroke="#E0A458" stroke-width="2.3" stroke-dasharray="1,7" stroke-linecap="round" />
<text class="arc-label" x="1144.0" y="989.0" text-anchor="middle" stroke="#101C2C" stroke-width="6" paint-order="stroke">tmn</text>
<rect x="733.0" y="1461.5" width="17.0" height="17.0" fill="#E0A458" transform="rotate(45 741.5 1470.0)" />
<path d="M 533.0,332.0 L 927.5,242.0" fill="none" stroke="#7C93A6" stroke-width="2.2" marker-end="url(#tri)" />
