<text class="card-name" x="-360.0" y="-67.5" font-size="42.5">RespResmTmnABC</text>
<text class="card-remark" x="-360.0" y="7.5">resonator split into ± modes</text>
<text class="card-remark" x="-360.0" y="65.0">plus a transmon subsystem</text>
</g>
<g transform="translate(1893.75,3145.0)">
<rect x="-425.0" y="-152.5" width="850.0" height="305.0" rx="10.0" fill="#101C2C" stroke="#4FC3E8" stroke-width="2.7" stroke-dasharray="17.5,12.5" />
<rect x="240.0" y="-112.5" width="145.0" height="55.0" rx="7.5" fill="none" stroke="#4FC3E8" stroke-width="1.8" />
<text class="card-badge-text" x="312.5" y="-75.0" text-anchor="middle" fill="#4FC3E8">ABC</text>
