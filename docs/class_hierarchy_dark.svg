<text class="card-name" x="-360.0" y="-67.5" font-size="42.5">SimpleSystemABC</text>
<text class="card-remark" x="-360.0" y="7.5">one mode, dim N —</text>
<text class="card-remark" x="-360.0" y="65.0">the composable unit</text>
</g>
<g transform="translate(2700.0,725.0)">
<rect x="-425.0" y="-152.5" width="850.0" height="305.0" rx="10.0" fill="#101C2C" stroke="#7C93A6" stroke-width="2.25" />
<text class="card-name" x="-360.0" y="-67.5" font-size="42.5">CombinedSystem</text>
<text class="card-remark" x="-360.0" y="7.5">⊗-composes several</text>
<text class="card-remark" x="-360.0" y="65.0">subsystems into one space</text>
</g>
<g transform="translate(525.0,1262.5)">
