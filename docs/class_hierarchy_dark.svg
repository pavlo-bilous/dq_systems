    .card-badge-text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 28.75px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 33.75px; fill: #E0A458; }
    .arc-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 33.75px; font-weight: 600; fill: #E0A458; }
    .zone-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 32.5px; font-weight: 600; letter-spacing: 0.12em; fill: #E0A458; }
    .zone-sub { font-family: ui-sans-serif, system-ui, Arial, sans-serif; font-size: 33.75px; fill: #7C93A6; }
  </style>

  <style>
    .card-name { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 700; fill: #E4ECF3; }
    .card-formula { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 38.8px; fill: #7C93A6; }
    .card-remark { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 38.8px; fill: #7C93A6; }
    .card-badge-text { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 28.8px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 33.8px; fill: #E0A458; }
    .arc-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 33.8px; font-weight: 600; fill: #E0A458; }
    .zone-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 32.5px; font-weight: 600; letter-spacing: 0.12em; fill: #E0A458; }
    .zone-sub { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 33.8px; fill: #7C93A6; }
  </style>
  <pattern id="grid" width="65.0" height="65.0" patternUnits="userSpaceOnUse">
    <circle cx="2.5" cy="2.5" r="2.5" fill="#7C93A6" opacity="0.22" />
  </pattern>
  <marker id="tri" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="30.0" markerHeight="30.0" orient="auto">
    <path d="M1,1 L11,6 L1,11 Z" fill="#101C2C" stroke="#7C93A6" stroke-width="1.4" stroke-linejoin="round" />
  </marker>

</defs>
