<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1612" height="2682" viewBox="-10 0 1612 2682" role="img" aria-label="Class hierarchy of dq_systems. Top: the general framework - QSystemABC branches into SimpleSystemABC (ResonatorMode, TransmonABC, TransmonKerr) and CombinedSystem. Bottom, in its own separated zone: the concrete resp_resm_tmn circuit chain from RespResmTmnABC to RespResmTmnKerrDirectDriven, which inherits from CombinedSystem and composes a TransmonABC, both up in the framework zone. Only ResonatorMode, TransmonABC, RespResmTmnKerrDirect, and RespResmTmnKerrDirectDriven carry a Param port of their own.">
<defs>
  <style>
    .card-name { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 700; fill: #E4ECF3; }
    .card-formula { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 30px; fill: #7C93A6; }
    .card-remark { font-family: ui-sans-serif, system-ui, Arial, sans-serif; font-size: 30px; fill: #7C93A6; }
    .card-badge-text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 19px; fill: #E0A458; }
    .arc-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 19px; font-weight: 600; fill: #E0A458; }
    .zone-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 28px; font-weight: 600; letter-spacing: 0.12em; fill: #E0A458; }
    .zone-sub { font-family: ui-sans-serif, system-ui, Arial, sans-serif; font-size: 27px; fill: #7C93A6; }
  </style>

  <style>
    .card-name { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 700; fill: #E4ECF3; }
    .card-formula { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 30px; fill: #7C93A6; }
    .card-remark { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 30px; fill: #7C93A6; }
    .card-badge-text { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 19px; fill: #E0A458; }
    .arc-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 19px; font-weight: 600; fill: #E0A458; }
    .zone-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 28px; font-weight: 600; letter-spacing: 0.12em; fill: #E0A458; }
    .zone-sub { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 27px; fill: #7C93A6; }
  </style>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="#7C93A6" opacity="0.22" />
  </pattern>
  <marker id="tri" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="15" markerHeight="15" orient="auto">
    <path d="M1,1 L11,6 L1,11 Z" fill="#101C2C" stroke="#7C93A6" stroke-width="1.4" stroke-linejoin="round" />
  </marker>

</defs>
<rect x="-10" y="0" width="1612" height="2682" fill="#0B1420" />
<rect x="-10" y="0" width="1612" height="2682" fill="url(#grid)" />
<rect x="6" y="1340.0" width="1580" height="1302.0" rx="12" fill="#E0A458" opacity="0.07" />
<rect x="6" y="1340.0" width="1580" height="1302.0" rx="12" fill="none" stroke="#E0A458" stroke-width="1.5" stroke-dasharray="2,6" opacity="0.55" />
<text class="zone-label" x="30" y="1384.0">THE CONCRETE CIRCUIT</text>
<text class="zone-sub" x="30" y="1428.0">one specific resonator + transmon readout, assembled from the framework above</text>
