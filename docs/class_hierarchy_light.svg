<g transform="translate(757.5,90)">
<rect x="-170.0" y="-61.0" width="340" height="122" rx="4" fill="#FFFFFF" stroke="#0E7DA6" stroke-width="1.8" stroke-dasharray="7,5" />
<rect x="96.0" y="-45.0" width="58" height="22" rx="3" fill="none" stroke="#0E7DA6" stroke-width="1.2" />
<text class="card-badge-text" x="125.0" y="-30.0" text-anchor="middle" fill="#0E7DA6">ABC</text>
<text class="card-name" x="-144.0" y="-27.0" font-size="17">QSystemABC</text>
<text class="card-remark" x="-144.0" y="3.0">the contract:</text>
<text class="card-remark" x="-144.0" y="26.0">must provide .Hamiltonian()</text>
</g>
<g transform="translate(435.0,290.0)">
<rect x="-170.0" y="-61.0" width="340" height="122" rx="4" fill="#FFFFFF" stroke="#0E7DA6" stroke-width="1.8" stroke-dasharray="7,5" />
<rect x="96.0" y="-45.0" width="58" height="22" rx="3" fill="none" stroke="#0E7DA6" stroke-width="1.2" />
<text class="card-badge-text" x="125.0" y="-30.0" text-anchor="middle" fill="#0E7DA6">ABC</text>
<text class="card-name" x="-144.0" y="-27.0" font-size="17">SimpleSystemABC</text>
<text class="card-remark" x="-144.0" y="3.0">one mode, dim N —</text>
<text class="card-remark" x="-144.0" y="26.0">the composable unit</text>
</g>
<g transform="translate(1080,290.0)">
<rect x="-170.0" y="-61.0" width="340" height="122" rx="4" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.5" />
<text class="card-name" x="-144.0" y="-27.0" font-size="17">CombinedSystem</text>
<text class="card-remark" x="-144.0" y="3.0">⊗-composes several</text>
<text class="card-remark" x="-144.0" y="26.0">subsystems into one space</text>
</g>
<g transform="translate(210,505.0)">
<rect x="-170.0" y="-76.0" width="340" height="152" rx="4" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.5" />
<text class="card-name" x="-144.0" y="-42.0" font-size="17">ResonatorMode</text>
<text class="card-formula" x="-144.0" y="-12.0"><tspan>H = ω &#183; </tspan><tspan>n</tspan></text>
<polyline points="-69.21999999999998,-21.8 -64.91999999999999,-27.2 -60.61999999999999,-21.8" fill="none" stroke="#4E5D6A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
<text class="card-remark" x="-144.0" y="11.0">a single harmonic mode</text>
<circle cx="-150.0" cy="41.0" r="4.5" fill="#A8641F" />
<text class="port-label" x="-132.0" y="46.0">port  ω</text>
</g>
<g transform="translate(660,505.0)">
<rect x="-170.0" y="-76.0" width="340" height="152" rx="4" fill="#FFFFFF" stroke="#0E7DA6" stroke-width="1.8" stroke-dasharray="7,5" />
<rect x="96.0" y="-60.0" width="58" height="22" rx="3" fill="none" stroke="#0E7DA6" stroke-width="1.2" />
<text class="card-badge-text" x="125.0" y="-45.0" text-anchor="middle" fill="#0E7DA6">ABC</text>
<text class="card-name" x="-144.0" y="-42.0" font-size="17">TransmonABC</text>
<text class="card-remark" x="-144.0" y="-12.0">circuit energies:</text>
<text class="card-remark" x="-144.0" y="11.0">Ec (charging), Ej (Josephson)</text>
<circle cx="-150.0" cy="41.0" r="4.5" fill="#A8641F" />
<text class="port-label" x="-132.0" y="46.0">port  Ej</text>
</g>
<g transform="translate(660,735.0)">
<rect x="-170.0" y="-76.0" width="340" height="152" rx="4" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.5" />
<text class="card-name" x="-144.0" y="-42.0" font-size="17">TransmonKerr</text>
<text class="card-remark" x="-144.0" y="-12.0">weakly-anharmonic transmon:</text>
<text class="card-remark" x="-144.0" y="11.0">linear + Kerr, from (Ec, ω_qub)</text>
<circle cx="-150.0" cy="41.0" r="4.5" fill="#A8641F" />
<text class="port-label" x="-132.0" y="46.0">port  ω_qub</text>
</g>
<g transform="translate(757.5,1088.0)">
<rect x="-170.0" y="-61.0" width="340" height="122" rx="4" fill="#FFFFFF" stroke="#0E7DA6" stroke-width="1.8" stroke-dasharray="7,5" />
<rect x="96.0" y="-45.0" width="58" height="22" rx="3" fill="none" stroke="#0E7DA6" stroke-width="1.2" />
<text class="card-badge-text" x="125.0" y="-30.0" text-anchor="middle" fill="#0E7DA6">ABC</text>
<text class="card-name" x="-144.0" y="-27.0" font-size="17">RespResmTmnABC</text>
<text class="card-remark" x="-144.0" y="3.0">resonator split into ± modes</text>
<text class="card-remark" x="-144.0" y="26.0">plus a transmon subsystem</text>
</g>
<g transform="translate(757.5,1288.0)">
<rect x="-170.0" y="-61.0" width="340" height="122" rx="4" fill="#FFFFFF" stroke="#0E7DA6" stroke-width="1.8" stroke-dasharray="7,5" />
<rect x="96.0" y="-45.0" width="58" height="22" rx="3" fill="none" stroke="#0E7DA6" stroke-width="1.2" />
<text class="card-badge-text" x="125.0" y="-30.0" text-anchor="middle" fill="#0E7DA6">ABC</text>
<text class="card-name" x="-144.0" y="-27.0" font-size="15">RespResmTmnKerrABC</text>
<text class="card-remark" x="-144.0" y="3.0">fixes the transmon to</text>
<text class="card-remark" x="-144.0" y="26.0">TransmonKerr(N, Ec, ω_qub)</text>
</g>
<g transform="translate(757.5,1503.0)">
<rect x="-170.0" y="-76.0" width="340" height="152" rx="4" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.5" />
<text class="card-name" x="-144.0" y="-42.0" font-size="15">RespResmTmnKerrDirect</text>
<text class="card-remark" x="-144.0" y="-12.0">+ direct g-coupling,</text>
<text class="card-remark" x="-144.0" y="11.0">Purcell-filter relaxation</text>
<circle cx="-150.0" cy="41.0" r="4.5" fill="#A8641F" />
<text class="port-label" x="-132.0" y="46.0">port  g</text>
</g>
<g transform="translate(757.5,1748.0)">
<rect x="-170.0" y="-91.0" width="340" height="182" rx="4" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.5" />
<text class="card-name" x="-144.0" y="-57.0" font-size="15">RespResmTmnKerrDirectDriven</text>
<text class="card-remark" x="-144.0" y="-27.0">+ external drives, moved</text>
<text class="card-remark" x="-144.0" y="-4.0">into the ω_drive rotating frame</text>
<circle cx="-150.0" cy="26.0" r="4.5" fill="#A8641F" />
<text class="port-label" x="-132.0" y="31.0">ports  drive_res, drive_tmn,</text>
<text class="port-label" x="-132.0" y="52.0">         ω_drive</text>
</g>
