<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="1925" viewBox="-6 0 1302 1925" role="img" aria-label="Class hierarchy of dq_systems. Top: the general framework - QSystemABC branches into SimpleSystemABC (ResonatorMode, TransmonABC, TransmonKerr) and CombinedSystem. Bottom, in its own separated zone: the concrete resp_resm_tmn circuit chain from RespResmTmnABC to RespResmTmnKerrDirectDriven, which inherits from CombinedSystem and composes a TransmonABC, both up in the framework zone.">
<defs>
  <style>
    .card-name { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 700; fill: #16202B; }
    .card-formula { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15.5px; fill: #4E5D6A; }
    .card-remark { font-family: ui-sans-serif, system-ui, Arial, sans-serif; font-size: 15.5px; fill: #4E5D6A; }
    .card-badge-text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; fill: #A8641F; }
    .arc-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #A8641F; }
    .zone-label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: #A8641F; }
    .zone-sub { font-family: ui-sans-serif, system-ui, Arial, sans-serif; font-size: 13.5px; fill: #4E5D6A; }
  </style>

  <style>
    .card-name { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 700; fill: #16202B; }
    .card-formula { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15.5px; fill: #4E5D6A; }
    .card-remark { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 15.5px; fill: #4E5D6A; }
    .card-badge-text { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; }
    .port-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13.5px; fill: #A8641F; }
    .arc-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13.5px; font-weight: 600; fill: #A8641F; }
    .zone-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: #A8641F; }
    .zone-sub { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; font-size: 13.5px; fill: #4E5D6A; }
  </style>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#4E5D6A" opacity="0.22" />
  </pattern>
  <marker id="tri" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M1,1 L11,6 L1,11 Z" fill="#FFFFFF" stroke="#4E5D6A" stroke-width="1.4" stroke-linejoin="round" />
  </marker>

</defs>
<rect x="-6" y="0" width="1302" height="1925" fill="#F3F5F7" />
<rect x="-6" y="0" width="1302" height="1925" fill="url(#grid)" />
